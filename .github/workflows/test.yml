name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: nightly
          neovim: true
      - name: Run tests
        run: nvim --headless -u tests/minimal_init.lua -i NONE -l tests/run.lua
